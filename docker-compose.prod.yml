version: '3.8'

services:
  # Database Service (PostgreSQL + pgvector)
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-chat_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-chat_db}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-admin}:${DB_PASSWORD:-admin}@db:5432/${DB_NAME:-chat_db}

      SECRET_KEY: ${SECRET_KEY}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      VECTOR_DB_PROVIDER: pgvector
      VECTOR_DB_URL: postgresql+asyncpg://${DB_USER:-admin}:${DB_PASSWORD:-admin}@db:5432/${DB_NAME:-chat_db}

      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-no-reply@basivo.in}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Knowledge base (Haystack + Unstructured + Ollama + Qdrant) — set in Coolify / .env
      UNSTRUCTURED_API_URL: ${UNSTRUCTURED_API_URL:-http://127.0.0.1:8000}
      UNSTRUCTURED_GENERAL_PATH: ${UNSTRUCTURED_GENERAL_PATH:-general/v0/general}
      UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-paraphrase-multilingual:latest}
      OLLAMA_PREFER_API_EMBED: ${OLLAMA_PREFER_API_EMBED:-true}
      OLLAMA_EMBED_TRUNCATE: ${OLLAMA_EMBED_TRUNCATE:-true}
      QDRANT_URL: ${QDRANT_URL:-http://127.0.0.1:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-cortex_kb}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-64}
      RAG_QDRANT_WRITE_BATCH_SIZE: ${RAG_QDRANT_WRITE_BATCH_SIZE:-128}
      KB_EMBEDDING_MAX_INPUT_TOKENS: ${KB_EMBEDDING_MAX_INPUT_TOKENS:-512}
      KB_CHUNK_CHARS_PER_TOKEN: ${KB_CHUNK_CHARS_PER_TOKEN:-4.0}
      KB_MIN_CHUNK_CHARS: ${KB_MIN_CHUNK_CHARS:-256}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOKENIZERS_PARALLELISM: "true"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        BACKEND_URL: ${BACKEND_URL:-http://chatbot_backend:8000}
    container_name: chatbot_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BACKEND_URL: ${BACKEND_URL:-http://chatbot_backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_data:
