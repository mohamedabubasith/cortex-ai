version: '3.8'

services:
  # Database Service (PostgreSQL + pgvector)
  # Using pgvector image as it is required for Cognee vector search.
  # If you specifically need TimescaleDB features, you would need a custom image combining both.
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot_db
    restart: always
    networks:
      default:
        aliases:
          - cognee-postgres
          - db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cognee_db
      POSTGRES_MULTIPLE_DATABASES: chat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cognee_db"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Backend Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Core
      SECRET_KEY: production_secret_key_change_me
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      LOG_LEVEL: INFO
      
      # Admin Credentials (Internal)
      ADMIN_EMAIL: admin@gmail.com
      ADMIN_PASSWORD: Apple@123
      
      # Database Connection
      DB_PROVIDER: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cognee_db
      DB_USERNAME: admin
      DB_PASSWORD: admin
      
      # Cognee Vector DB (Required for persistence)
      VECTOR_DB_PROVIDER: pgvector
      VECTOR_DB_URL: postgresql://admin:admin@db:5432/cognee_db
      
      # App Database Connection
      APP_DB_HOST: db
      APP_DB_PORT: 5432
      APP_DB_NAME: chat_db
      APP_DB_USERNAME: admin
      APP_DB_PASSWORD: admin
      
      # Constructed URLs (Force internal hostnames)
      DATABASE_URL: postgresql+asyncpg://admin:admin@db:5432/chat_db
      
      # Vector DB & Embeddings
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSIONS: 384
      
      # Security & Access Control
      ENABLE_BACKEND_ACCESS_CONTROL: "true"
      REQUIRE_AUTHENTICATION: "true"
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      
      # Google Sign-In
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://chat.basivo.in
        BACKEND_URL: http://chatbot_backend:8000
    container_name: chatbot_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://chat.basivo.in
      BACKEND_URL: http://chatbot_backend:8000
      NEXT_PUBLIC_ENABLE_GRAPH: "false"

  # Neo4j Graph Database
  # Only used if ENABLE_GRAPH=true in backend
  # neo4j:
  #   image: neo4j:5.16.0
  #   container_name: chatbot_neo4j
  #   restart: always
  #   environment:
  #     NEO4J_AUTH: neo4j/password
  #     # Enable APOC if needed
  #     NEO4J_PLUGINS: '["apoc"]'
  #     NEO4J_apoc_export_file_enabled: "true"
  #     NEO4J_apoc_import_file_enabled: "true"
  #     NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
  #   ports:
  #     - "7474:7474"
  #     - "7687:7687"
  #   volumes:
  #     - neo4j_data:/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: chatbot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/chat.basivo.in/fullchain.pem:/etc/letsencrypt/live/chat.basivo.in/fullchain.pem:ro
      - /etc/letsencrypt/live/chat.basivo.in/privkey.pem:/etc/letsencrypt/live/chat.basivo.in/privkey.pem:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  neo4j_data:
