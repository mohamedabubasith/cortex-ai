version: '3.8'

services:
  # Database Service (PostgreSQL + pgvector)
  # Using pgvector image as it is required for Cognee vector search.
  # If you specifically need TimescaleDB features, you would need a custom image combining both.
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot_db
    restart: always
    networks:
      default:
        aliases:
          - cognee-postgres
          - db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-cognee_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-admin} -d ${DB_NAME:-cognee_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Core
      SECRET_KEY: ${SECRET_KEY:-production_secret_key_change_me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Database Connection
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cognee_db
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      
      # App Database Connection
      APP_DB_HOST: db
      APP_DB_PORT: 5432
      APP_DB_NAME: cognee_db
      APP_DB_USERNAME: ${APP_DB_USERNAME:-admin}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-admin}
      
      # Constructed URLs (Force internal hostnames)
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USERNAME:-admin}:${APP_DB_PASSWORD:-admin}@db:5432/cognee_db
      VECTOR_DB_URL: postgresql+asyncpg://${DB_USERNAME:-admin}:${DB_PASSWORD:-admin}@db:5432/cognee_db
      
      # Vector DB & Embeddings
      VECTOR_DB_PROVIDER: ${VECTOR_DB_PROVIDER:-pgvector}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      
      # Security & Access Control
      ENABLE_BACKEND_ACCESS_CONTROL: ${ENABLE_BACKEND_ACCESS_CONTROL:-true}
      REQUIRE_AUTHENTICATION: ${REQUIRE_AUTHENTICATION:-true}
      
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: chatbot_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_BACKEND_URL: http://backend:8000

volumes:
  postgres_data:
