[project]
name = "cortex-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Basivo with Haystack RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0,<4.2.0",
    "ecdsa>=0.19.0",
    "httpx",
    "python-multipart",
    "alembic",
    "openai",
    "qdrant-client",
    "pypdf",
    "python-docx",
    "protego",
    "playwright",
    "pgvector",
    "openpyxl",
    "pandas",
    "python-pptx",
    "fastmcp",
    "beautifulsoup4",
    "duckduckgo-search",
    "tiktoken",
    "instructor",
    "neo4j",
    "anthropic",
    "haystack-ai>=2.8",
    "qdrant-haystack>=10.3.0",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: live external services (Unstructured, Ollama, Qdrant, Postgres)",
]

