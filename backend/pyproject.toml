[project]
name = "cortex-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Basivo with LangChain RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0,<4.2.0",
    "ecdsa>=0.19.0",
    "httpx",
    "python-multipart",
    "alembic",
    "openai",
    "langchain",
    "langchain-community",
    "fastembed",
    "langchain-chroma",
    "langchain-text-splitters",
    "langchain-openai",
    "chromadb",
    "qdrant-client",
    "pypdf",
    "python-docx",
    "protego",
    "playwright",
    "pgvector",
    "openpyxl",
    "pandas",
    "python-pptx",
    "unstructured[all-docs]",
    "fastmcp",
    "beautifulsoup4",
    "duckduckgo-search",
    "tiktoken",
    "instructor",
    "docling",
    "cognee",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

