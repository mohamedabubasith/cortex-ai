version: '3.8'

services:
  # Backend Service (FastAPI)
  # Connects to your external TimescaleDB on the host machine.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Application Database (TimescaleDB on host)
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: basiva
      DB_USERNAME: admin
      DB_PASSWORD: admin

      # Security
      SECRET_KEY: ${SECRET_KEY:-development_secret_key_only_change_me_in_prod}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-ec49d476-0757-46c5-a4de-9c0b5a87a20a}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Apple@123}

      # Embeddings
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

      # Vector Store
      VECTOR_DB_PROVIDER: pgvector

      LOG_LEVEL: DEBUG
      TOKENIZERS_PARALLELISM: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: chatbot_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
