version: '3.8'

services:
  # Database Service
  # Using pgvector image as Cognee requires pgvector extension for vector search.
  # This serves as the "internal postgres db" with vector capabilities.
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432" # Exposed on 5433 to avoid conflicts with local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (FastAPI + Cognee)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: always
    environment:
      # Connection to internal DB service
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/chatbot
      # OpenAI Key must be provided in .env file or environment
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Enable Access Control for Cognee
      ENABLE_BACKEND_ACCESS_CONTROL: "true"
      # Environment
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploads
      - ./backend/uploads:/app/uploads

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot_frontend
    restart: always
    environment:
      # URL for the browser to access the backend
      # Change localhost to your domain/IP when deploying to cloud
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
